<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenie - AI Learning Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Welcome to EduGenie 🎓</h1>
        <p>Your personal AI tutor for learning support!</p>

        <form id="edugenie-form">
            <label>Select Task:</label>
            <select name="task" id="task">
                <option value="explain">Explain Concept</option>
                <option value="qna">QnA</option>
                <option value="quiz">Quiz Generation</option>
                <option value="summary">Summary</option>
                <option value="recommend">Recommend Path</option>
            </select>

            <label>Enter your topic/question:</label>
            <textarea name="user_input" id="user_input" rows="5" placeholder="e.g., Explain Photosynthesis..."></textarea>

            <button type="submit">Submit</button>
        </form>

        <div id="result" class="result-container">
            <h3>Result will appear here...</h3>
        </div>
    </div>

    <script>
        const form = document.getElementById('edugenie-form');
        const input = document.getElementById('user_input');
        const resultDiv = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = input.value;
            resultDiv.innerHTML = '<h3>Loading...</h3>';

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });
                const data = await response.json();
                resultDiv.innerHTML = `<h3>${data.answer}</h3>`;
            } catch (error) {
                resultDiv.innerHTML = `<h3>EduGenie explains ${question} in 3 simple steps! (Demo Mode)</h3>`;
            }
        });
    </script>
</body>
</html>
